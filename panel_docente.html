<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Docente — Cálculo Integral</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBmRSarMxqcAUDdCyc-7bBupZpSfZRHEgA",
    authDomain: "examen-de-calculo.firebaseapp.com",
    projectId: "examen-de-calculo",
    storageBucket: "examen-de-calculo.firebasestorage.app",
    messagingSenderId: "596084718972",
    appId: "1:596084718972:web:778f22d2f49aab38d7f8f9",
    measurementId: "G-6DYGZKZMRJ"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.__db=db; window.__collection=collection; window.__getDocs=getDocs;
  window.__deleteDoc=deleteDoc; window.__doc=doc; window.__fbReady=true;
  window.dispatchEvent(new Event('fb-ready'));
</script>
<style>
:root{--ink:#1a1208;--ink2:#3d2f1a;--parch:#faf6ee;--parch2:#f2ead8;--gold:#b8860b;--gold2:#d4a01a;--red:#8b1a1a;--green:#1a5c2e;--border:#c8b98a;--shadow:rgba(90,60,10,.13);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#ede6d3;background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(180,160,100,.06) 28px,rgba(180,160,100,.06) 29px);min-height:100vh;font-family:'Source Serif 4',Georgia,serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 4rem;}
#login-screen{width:100%;max-width:420px;margin-top:6vh;}
.login-box{background:var(--parch);border:1.5px solid var(--gold);border-radius:8px;padding:2.5rem 2rem;box-shadow:0 4px 20px var(--shadow);text-align:center;}
.login-box h1{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--ink);margin-bottom:.3rem;}
.login-box .sub{font-size:.82rem;color:var(--ink2);font-style:italic;margin-bottom:2rem;}
.login-box label{display:block;text-align:left;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:.3rem;}
.login-box input[type=password]{width:100%;padding:.6rem .9rem;font-family:'Source Serif 4',Georgia,serif;font-size:.95rem;border:1px solid var(--border);border-radius:4px;background:var(--parch2);color:var(--ink);outline:none;transition:border-color .15s;margin-bottom:1.2rem;}
.login-box input[type=password]:focus{border-color:var(--gold);}
.login-box input.err{border-color:var(--red);background:#fdf0f0;}
.btn-primary{width:100%;padding:.75rem;background:var(--ink);color:#fdf6e3;font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;letter-spacing:.06em;border:none;border-radius:4px;cursor:pointer;transition:background .2s;}
.btn-primary:hover{background:var(--gold);}
.login-err{font-size:.82rem;color:var(--red);margin-top:.8rem;display:none;font-style:italic;}
#panel-screen{display:none;width:100%;max-width:1000px;}
header.ph{width:100%;padding-bottom:1.2rem;border-bottom:2px solid var(--gold);margin-bottom:2rem;position:relative;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
header.ph::after{content:'';position:absolute;bottom:-5px;left:0;width:40%;height:1px;background:var(--gold2);}
.ptb .uni{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:.3rem;}
.ptb h1{font-family:'Playfair Display',serif;font-size:1.8rem;color:var(--ink);}
.ptb .sub{font-size:.82rem;color:var(--ink2);font-style:italic;}
.ha{display:flex;gap:.6rem;flex-wrap:wrap;}
.btn-sm{padding:.45rem 1rem;font-family:'Playfair Display',serif;font-size:.82rem;font-weight:600;letter-spacing:.04em;border-radius:4px;cursor:pointer;transition:background .15s,color .15s;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--ink2);}
.btn-outline:hover{background:var(--parch2);border-color:var(--gold);color:var(--ink);}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
.btn-danger:hover{background:#fdf0f0;}
.btn-gold{background:var(--gold);border:1px solid var(--gold);color:#fff;}
.btn-gold:hover{background:var(--gold2);}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:2rem;}
.stat-card{background:var(--parch);border:1px solid var(--border);border-radius:6px;padding:1rem 1.2rem;box-shadow:0 2px 6px var(--shadow);}
.stat-card .s-label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:.35rem;}
.stat-card .s-val{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--ink);line-height:1;}
.stat-card .s-sub{font-size:.75rem;color:var(--ink2);margin-top:.2rem;font-style:italic;}
.filter-row{display:flex;gap:.7rem;margin-bottom:1.2rem;flex-wrap:wrap;align-items:center;}
.filter-row input[type=text]{flex:1;min-width:180px;padding:.45rem .75rem;font-family:'Source Serif 4',Georgia,serif;font-size:.88rem;border:1px solid var(--border);border-radius:4px;background:var(--parch2);color:var(--ink);outline:none;}
.filter-row input[type=text]:focus{border-color:var(--gold);}
.filter-row select{padding:.45rem .75rem;font-family:'Source Serif 4',Georgia,serif;font-size:.88rem;border:1px solid var(--border);border-radius:4px;background:var(--parch2);color:var(--ink);outline:none;cursor:pointer;}
.table-wrap{background:var(--parch);border:1px solid var(--border);border-radius:6px;overflow:hidden;box-shadow:0 2px 10px var(--shadow);overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
thead tr{background:var(--parch2);border-bottom:2px solid var(--border);}
thead th{padding:.7rem 1rem;text-align:left;font-family:'Playfair Display',serif;font-weight:600;color:var(--ink2);font-size:.8rem;letter-spacing:.06em;white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background .12s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--parch2);}
tbody td{padding:.65rem 1rem;color:var(--ink);vertical-align:middle;}
.td-name{font-weight:500;}.td-email,.td-date{font-size:.8rem;color:var(--ink2);}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:3px;font-size:.75rem;font-weight:600;font-family:'Playfair Display',serif;white-space:nowrap;}
.b10{background:#d4f0da;color:#1a5c2e;}.b9{background:#ddf0d4;color:#2a5c1a;}.b8{background:#f0ebd4;color:#5c4e1a;}
.b7{background:#f0e4d4;color:#5c3c1a;}.b6{background:#f0d8d4;color:#5c2a1a;}.blow{background:#f4d4d4;color:#8b1a1a;}
.score-bar-wrap{display:flex;align-items:center;gap:8px;}
.score-bar{height:6px;border-radius:3px;flex:1;max-width:80px;background:#e8dfc8;}
.score-bar-fill{height:100%;border-radius:3px;background:var(--gold);}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--ink2);font-style:italic;}
.detail-row{display:none;}
.detail-row td{padding:.5rem 1rem .8rem 3rem;background:#fdf8f0;}
.detail-grid{display:flex;flex-wrap:wrap;gap:6px;}
.q-chip{font-size:.72rem;padding:.2rem .55rem;border-radius:3px;font-family:'Playfair Display',serif;font-weight:600;}
.q-chip.ok{background:#d4f0da;color:#1a5c2e;}.q-chip.fail{background:#f4d4d4;color:#8b1a1a;}.q-chip.skip{background:#e8e0d0;color:#8a7050;}
.toggle-btn{background:none;border:none;cursor:pointer;color:var(--gold);font-size:.78rem;padding:0;font-family:'Source Serif 4',serif;text-decoration:underline;}
.del-btn{background:none;border:none;cursor:pointer;color:var(--red);font-size:.78rem;padding:0;}
.del-btn:hover{text-decoration:underline;}
.pagination{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap;}
.pg-btn{padding:.3rem .7rem;border:1px solid var(--border);border-radius:4px;background:var(--parch2);cursor:pointer;font-size:.82rem;color:var(--ink2);}
.pg-btn:hover{background:var(--parch);border-color:var(--gold);color:var(--ink);}
.pg-btn.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div style="font-size:2.2rem;margin-bottom:.5rem;">🔐</div>
    <h1>Panel Docente</h1>
    <p class="sub">Cálculo Integral — Acceso restringido</p>
    <label for="pwd-input">Contraseña de acceso</label>
    <input type="password" id="pwd-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-primary" onclick="doLogin()">Ingresar al panel</button>
    <div class="login-err" id="login-err">Contraseña incorrecta. Intenta de nuevo.</div>
    <p style="font-size:.72rem;color:var(--ink2);margin-top:1rem;">Contraseña: <code>docente2025</code></p>
  </div>
</div>

<div id="panel-screen">
  <header class="ph">
    <div class="ptb">
      <div class="uni">Departamento de Matemáticas</div>
      <h1>Panel Docente</h1>
      <div class="sub">Resultados en tiempo real — Firebase ☁</div>
    </div>
    <div class="ha">
      <button class="btn-sm btn-gold" onclick="exportCSV()">⬇ Exportar CSV</button>
      <button class="btn-sm btn-outline" onclick="loadData()">↻ Actualizar</button>
      <button class="btn-sm btn-danger" onclick="clearAll()">🗑 Borrar todo</button>
      <button class="btn-sm btn-outline" onclick="doLogout()">Salir</button>
    </div>
  </header>
  <div class="stats-grid" id="stats-grid"></div>
  <div class="filter-row">
    <input type="text" id="search-input" placeholder="Buscar por nombre o correo..." oninput="applyFilters()">
    <select id="filter-grade" onchange="applyFilters()">
      <option value="">Todos los resultados</option>
      <option value="10">Excelente (10)</option>
      <option value="9">Muy bien (9)</option>
      <option value="8">Bien (8)</option>
      <option value="7">Satisfactorio (7)</option>
      <option value="6">Suficiente (6)</option>
      <option value="low">No acreditado</option>
    </select>
    <select id="sort-select" onchange="applyFilters()">
      <option value="fecha-desc">Más reciente primero</option>
      <option value="fecha-asc">Más antiguo primero</option>
      <option value="cal-desc">Mayor calificación</option>
      <option value="cal-asc">Menor calificación</option>
      <option value="nombre">Nombre A→Z</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Alumno</th><th>Correo</th><th>Calificación</th><th>Presentado</th><th>Detalle</th><th>Borrar</th></tr></thead>
      <tbody id="results-body"><tr><td colspan="7"><div class="empty-state">⏳ Cargando resultados...</div></td></tr></tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
  <div style="font-size:.75rem;color:var(--ink2);text-align:right;margin-top:.5rem;" id="count-label"></div>
</div>

<script>
const PASS='docente2025',SESSION_KEY='docente_auth_fb',PAGE_SIZE=15;
const qLabels={q1:'P1',q2:'P2',q3:'P3',q4:'P4',q5:'P5',q6:'P6',q7:'P7',q8:'P8',q9:'P9',q10:'P10'};
const correctAnswers={q1:1,q2:0,q3:1,q4:0,q5:3,q6:1,q7:2,q8:3,q9:2,q10:1};
let allRecords=[],filtered=[],currentPage=1;

function doLogin(){
  const val=document.getElementById('pwd-input').value;
  const errEl=document.getElementById('login-err');
  const inp=document.getElementById('pwd-input');
  if(val===PASS){
    sessionStorage.setItem(SESSION_KEY,'1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('panel-screen').style.display='block';
    inp.classList.remove('err');errEl.style.display='none';loadData();
  }else{inp.classList.add('err');errEl.style.display='block';inp.value='';inp.focus();}
}
function doLogout(){
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('login-screen').style.display='block';
  document.getElementById('panel-screen').style.display='none';
  document.getElementById('pwd-input').value='';
}
if(sessionStorage.getItem(SESSION_KEY)==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('panel-screen').style.display='block';
}

async function loadData(){
  document.getElementById('results-body').innerHTML='<tr><td colspan="7"><div class="empty-state">⏳ Cargando desde Firebase...</div></td></tr>';
  try{
    if(!window.__fbReady)await new Promise(r=>window.addEventListener('fb-ready',r,{once:true}));
    const snap=await window.__getDocs(window.__collection(window.__db,'resultados'));
    allRecords=[];
    snap.forEach(d=>allRecords.push({_id:d.id,...d.data()}));
    allRecords.sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));
    applyFilters();
  }catch(e){
    document.getElementById('results-body').innerHTML=`<tr><td colspan="7"><div class="empty-state">❌ Error: ${e.message}</div></td></tr>`;
  }
}
function applyFilters(){
  const q=(document.getElementById('search-input').value||'').toLowerCase();
  const gr=document.getElementById('filter-grade').value;
  const sort=document.getElementById('sort-select').value;
  filtered=allRecords.filter(r=>{
    const mq=!q||r.nombre.toLowerCase().includes(q)||r.correo.toLowerCase().includes(q);
    let mg=true;
    if(gr==='low')mg=r.calificacion<6;
    else if(gr)mg=r.calificacion===parseInt(gr);
    return mq&&mg;
  });
  filtered.sort((a,b)=>{
    if(sort==='cal-desc')return b.calificacion-a.calificacion;
    if(sort==='cal-asc')return a.calificacion-b.calificacion;
    if(sort==='nombre')return a.nombre.localeCompare(b.nombre);
    if(sort==='fecha-asc')return new Date(a.fecha||0)-new Date(b.fecha||0);
    return new Date(b.fecha||0)-new Date(a.fecha||0);
  });
  currentPage=1;renderStats();renderTable();
}
function renderStats(){
  const total=allRecords.length;
  const cals=allRecords.map(r=>r.calificacion);
  const avg=total?(cals.reduce((a,b)=>a+b,0)/total).toFixed(1):'—';
  const max=total?Math.max(...cals):'—';
  const ap=cals.filter(c=>c>=6).length;
  const pctAp=total?Math.round(ap/total*100):0;
  let qFail=null,qFailCount=0;
  for(let i=1;i<=10;i++){
    const key=`q${i}`;
    const fails=allRecords.filter(r=>r.respuestas&&r.respuestas[key]!==correctAnswers[key]).length;
    if(fails>qFailCount){qFailCount=fails;qFail=key;}
  }
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card"><div class="s-label">Alumnos presentados</div><div class="s-val">${total}</div><div class="s-sub">registros en la nube</div></div>
    <div class="stat-card"><div class="s-label">Promedio del grupo</div><div class="s-val">${avg}</div><div class="s-sub">sobre 10 puntos</div></div>
    <div class="stat-card"><div class="s-label">Calificación máxima</div><div class="s-val">${max}</div><div class="s-sub">mejor resultado</div></div>
    <div class="stat-card"><div class="s-label">Índice de aprobación</div><div class="s-val">${pctAp}%</div><div class="s-sub">${ap} de ${total} aprobaron</div></div>
    <div class="stat-card"><div class="s-label">Pregunta más difícil</div><div class="s-val" style="font-size:1rem;margin-top:4px">${qFail||'—'}</div><div class="s-sub">${qFail?qFailCount+' errores':''}</div></div>`;
}
function bc(c){if(c===10)return'b10';if(c>=9)return'b9';if(c>=8)return'b8';if(c>=7)return'b7';if(c>=6)return'b6';return'blow';}
function renderTable(){
  const tbody=document.getElementById('results-body');
  const total=filtered.length;
  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(currentPage>pages)currentPage=pages;
  const start=(currentPage-1)*PAGE_SIZE;
  const slice=filtered.slice(start,start+PAGE_SIZE);
  if(total===0){tbody.innerHTML='<tr><td colspan="7"><div class="empty-state">📭 No hay registros.</div></td></tr>';document.getElementById('count-label').textContent='';renderPagination(0,1);return;}
  tbody.innerHTML=slice.map((r,idx)=>{
    const gi=start+idx;const rid=`row-${gi}`;
    const pct=(r.calificacion/10*100).toFixed(0);
    const chips=Object.keys(qLabels).map(key=>{
      const ans=r.respuestas?r.respuestas[key]:undefined;
      const cls=ans===null||ans===undefined?'skip':(ans===correctAnswers[key]?'ok':'fail');
      const sym=cls==='ok'?'✓':cls==='fail'?'✗':'—';
      return `<span class="q-chip ${cls}">${sym} ${qLabels[key]}</span>`;
    }).join('');
    return `<tr>
      <td style="color:var(--ink2);font-size:.8rem">${gi+1}</td>
      <td><div class="td-name">${esc(r.nombre)}</div></td>
      <td><div class="td-email">${esc(r.correo)}</div></td>
      <td><div class="score-bar-wrap"><span class="badge ${bc(r.calificacion)}">${r.calificacion}/10</span><div class="score-bar"><div class="score-bar-fill" style="width:${pct}%"></div></div></div></td>
      <td><div class="td-date">${esc(r.fechaLegible||'—')}</div></td>
      <td><button class="toggle-btn" onclick="toggleDetail('${rid}')">ver →</button></td>
      <td><button class="del-btn" onclick="deleteRecord('${r._id}','${esc(r.nombre)}')">🗑</button></td>
    </tr>
    <tr class="detail-row" id="${rid}"><td colspan="7"><div class="detail-grid">${chips}</div></td></tr>`;
  }).join('');
  document.getElementById('count-label').textContent=`Mostrando ${start+1}–${Math.min(start+PAGE_SIZE,total)} de ${total} registros`;
  renderPagination(total,pages);
}
function toggleDetail(id){const r=document.getElementById(id);r.style.display=r.style.display==='table-row'?'none':'table-row';}
async function deleteRecord(id,nombre){
  if(!confirm(`¿Eliminar el registro de "${nombre}"?`))return;
  try{await window.__deleteDoc(window.__doc(window.__db,'resultados',id));await loadData();}
  catch(e){alert('Error: '+e.message);}
}
async function clearAll(){
  if(!confirm('¿Borrar TODOS los registros? Esta acción es irreversible.'))return;
  try{
    const snap=await window.__getDocs(window.__collection(window.__db,'resultados'));
    await Promise.all([...snap.docs].map(d=>window.__deleteDoc(window.__doc(window.__db,'resultados',d.id))));
    await loadData();
  }catch(e){alert('Error: '+e.message);}
}
function renderPagination(total,pages){
  const pg=document.getElementById('pagination');
  if(pages<=1){pg.innerHTML='';return;}
  let h=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  for(let i=1;i<=pages;i++)h+=`<button class="pg-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
  h+=`<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>›</button>`;
  pg.innerHTML=h;
}
function goPage(p){currentPage=p;renderTable();}
function exportCSV(){
  if(!allRecords.length){alert('No hay registros para exportar.');return;}
  const qKeys=Object.keys(qLabels);
  const header=['#','Nombre','Correo','Calificación','Descripción','Fecha',...qKeys].join(',');
  const rows=allRecords.map((r,i)=>{
    const qCols=qKeys.map(key=>{const ans=r.respuestas?r.respuestas[key]:null;return ans===null||ans===undefined?'Sin respuesta':(ans===correctAnswers[key]?'Correcta':'Incorrecta');});
    return [i+1,`"${r.nombre}"`,`"${r.correo}"`,r.calificacion,`"${r.descripcion||''}"`,`"${r.fechaLegible||''}"`, ...qCols].join(',');
  });
  const csv=[header,...rows].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='resultados.csv';a.click();URL.revokeObjectURL(url);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
if(sessionStorage.getItem(SESSION_KEY)==='1')loadData();
</script>
</body>
</html>
